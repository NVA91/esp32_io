<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESP32 Template</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f1e8;
        --card: #fffaf2;
        --ink: #1d2a32;
        --accent: #0d7a68;
        --line: #d7c8b4;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "IBM Plex Sans", sans-serif;
        background: radial-gradient(circle at top, #fff8ec 0%, var(--bg) 55%, #e7dbc9 100%);
        color: var(--ink);
      }

      main {
        width: min(92vw, 38rem);
        padding: 2rem;
        border: 1px solid var(--line);
        border-radius: 1.5rem;
        background: var(--card);
        box-shadow: 0 1.2rem 3rem rgba(29, 42, 50, 0.12);
      }

      h1 {
        margin-top: 0;
        font-family: "Space Grotesk", sans-serif;
      }

      p {
        line-height: 1.6;
      }

      code {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ESP32 Template</h1>
      <p>Die Vorlage ist aktiv. Statusdaten liefert <code>/api/status</code>.</p>
    </main>
  </body>
</html>
